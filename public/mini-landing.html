<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mini Landing - TiqueteVivo</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="font-sans">
    <main class="max-w-3xl mx-auto p-6">
      <header class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold">Lavandería Ejemplo</h1>
        <div class="text-sm text-gray-600">⭐ 4.8 · 120 reseñas</div>
      </header>

      <section class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
        <div class="md:col-span-2">
          <h2 class="text-xl font-semibold mb-2">Lava y Plancha rápido y seguro</h2>
          <p class="text-gray-700 mb-4">Entrega en 24 horas. Aceptamos pago online y en efectivo al recoger.</p>

          <div class="space-y-3">
            <div class="card flex items-center justify-between">
              <div>
                <div class="font-medium">Lavado Básico</div>
                <div class="text-sm text-gray-500">30 min · $10</div>
              </div>
              <button class="btn-primary">Pedir</button>
            </div>
            <div class="card flex items-center justify-between">
              <div>
                <div class="font-medium">Lavado + Secado</div>
                <div class="text-sm text-gray-500">45 min · $12</div>
              </div>
              <button class="btn-primary">Pedir</button>
            </div>
          </div>
        </div>

        <aside class="flex flex-col items-center">
          <div class="card w-full flex flex-col items-center">
            <!-- QR grande objetivo 260px ideal en móvil -->
            <div class="w-64 h-64 flex items-center justify-center bg-gray-50 rounded-md mb-3">
              <!-- Inline SVG placeholder for QR -->
              <svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect width="180" height="180" fill="#ffffff"/>
                <rect x="10" y="10" width="40" height="40" fill="#0B6E4F"/>
                <rect x="130" y="10" width="40" height="40" fill="#0B6E4F"/>
                <rect x="10" y="130" width="40" height="40" fill="#0B6E4F"/>
                <text x="90" y="95" font-size="18" text-anchor="middle" fill="#9CA3AF">QR</text>
              </svg>
            </div>
            <div class="text-sm text-gray-600">Escanea para pedir</div>
            <a href="#" class="mt-3 text-sm text-primary">Abrir enlace</a>
          </div>

          <div class="mt-4 text-xs text-gray-500 text-center">¿Necesitas ayuda? <a href="https://wa.me/000000000" class="text-primary">WhatsApp</a></div>
        </aside>
      </section>
    </main>
  </body>
</html>
